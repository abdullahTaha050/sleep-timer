<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Sleep Timer</title>
  <link rel="stylesheet" href="popup.css">
  <script src="../shared/i18n.js" defer></script>
  <script src="../shared/settings.js" defer></script>
  <script src="popup.js" defer></script>
</head>
<body>
  <main>
    <header class="header">
      <span class="app-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none"><path d="M20.2 14.3A8.5 8.5 0 0 1 9.7 3.8a8.5 8.5 0 1 0 10.5 10.5Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <div class="identity"><h1>Sleep Timer</h1><p>Netflix &amp; HBO Max</p></div>
      <bdi id="version" class="version"></bdi>
    </header>

    <section class="status-card" aria-labelledby="status-label">
      <div class="status-copy"><span id="status-label" data-i18n="popupStatus"></span><strong id="status" role="status" aria-live="polite">…</strong></div>
      <div class="toggle-area">
        <button id="enabled" class="switch" type="button" role="switch" aria-checked="false" aria-labelledby="toggle-label" disabled><span></span></button>
        <span id="toggle-label" data-i18n="popupToggle"></span>
      </div>
    </section>
    <p id="error" role="alert" hidden></p>

    <nav class="links">
      <a class="primary" href="https://github.com/abdullahTaha050/sleep-timer/releases" target="_blank" rel="noopener noreferrer" data-i18n="popupReleaseNotes"></a>

        <a href="https://github.com/abdullahTaha050/sleep-timer/issues/new/choose" target="_blank" rel="noopener noreferrer"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M21 11a8 8 0 0 1-8 8H9l-5 3v-6a8 8 0 0 1-2-5 8 8 0 0 1 8-8h3a8 8 0 0 1 8 8Z"/></svg><span data-i18n="popupFeedback"></span></a>
      </div>
    </nav>
  </main>

</html>
