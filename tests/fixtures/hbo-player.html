<!-- Synthetic structure derived from the supplied HBO HTML. No account data, media URLs or generated classes. -->
<video id="preview"></video>
<div data-testid="playerContainer">
  <video data-testid="VideoElement"></video>
  <div><div data-testid="overlay-root" role="group" aria-label="video player">
    <div data-testid="up_next" style="display:inline;visibility:hidden"></div>
    <div data-testid="skip"><button data-testid="player-ux-skip-button">Skip intro</button></div>
    <!-- Deliberately first: a broad footer lookup would mount into this hidden overlay. -->
    <div data-testid="QuickCatchupOverlay" style="visibility:hidden">
      <div data-testid="control_footer"><div>
        <div><button data-testid="player-ux-play-pause-button">Play</button></div>
        <div class="catchup-right"><div data-testid="volume-container"><button data-testid="player-ux-volume-button">Volume</button></div><button data-testid="player-ux-fullscreen-button">Fullscreen</button></div>
      </div></div>
    </div>
    <div data-testid="playback_controls" style="display:inline;visibility:visible">
      <div><div data-testid="protection_layer"></div><div>
        <button data-testid="player-ux-back-button">Back</button>
        <div><button data-testid="player-ux-play-pause-button">Play</button></div>
        <div data-testid="control_footer">
          <div data-testid="content-metadata"><span data-testid="player-ux-asset-title">Example</span></div>
          <div><input type="range" data-testid="player-ux-scrubber-position"></div>
          <div class="bottom-row">
            <div><button data-testid="player-ux-play-pause-button">Play</button></div>
            <div><button data-testid="chips-collapsed-data-testid">Episodes</button></div>
            <div class="normal-right">
              <div data-testid="volume-container"><button data-testid="player-ux-volume-button">Volume</button></div>
              <button data-testid="player-ux-track-selector-button">Audio</button>
              <button data-testid="player-ux-fullscreen-button">Fullscreen</button>
            </div>
          </div>
        </div>
      </div></div>
    </div>
  </div></div>
</div>
