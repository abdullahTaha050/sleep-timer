<!-- Minimal synthetic Prime Video structure. No original page, account data, media URLs or generated classes. -->
<video id="preview"></video>
<div id="dv-web-player" tabindex="-1">
  <div>
    <div class="atvwebplayersdk-video-surface"><div><video aria-hidden="true"></video></div></div>
    <div class="atvwebplayersdk-player-container" aria-label="Web Player">
      <div class="header"><div><div>
        <div><button id="atvwebplayersdk-close-player-button">Close player</button></div>
        <div><div class="right-controls">
          <div><button id="atvwebplayersdk-captions-toggle-button">Subtitles</button></div>
          <div><div><button id="atvwebplayersdk-mute-toggle-button">Volume</button><input id="atvwebplayersdk-volume-slider" type="range"></div></div>
          <div><button>Picture in picture</button></div>
          <div><button id="atvwebplayersdk-fullscreen-toggle-button">Fullscreen</button></div>
          <div><div><button>Speed</button><button>Settings</button></div></div>
        </div></div>
      </div></div></div>
      <div class="atvwebplayersdk-loading-overlay" role="status"></div>
      <div class="atvwebplayersdk-toast-wrapper" role="status"></div>
      <div class="atvwebplayersdk-nextupcard-wrapper"><div></div></div>
    </div>
  </div>
</div>
